<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Kimera Eventi</title>
<meta name="robots" content="noindex">
<script>
var ANDROID = "https://play.google.com/store/apps/details?id=it.kimeraeventi.pienissimo";
var IOS = "https://apps.apple.com/it/app/kimera-eventi/id6793140437";
var ua = navigator.userAgent || "";
var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var isAndroid = /Android/i.test(ua);
if (isAndroid) { location.replace(ANDROID); }
else if (isIOS) { location.replace(IOS); }
</script>
<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f6f3ea; color: #222; text-align: center; }
.box { max-width: 420px; margin: 12vh auto 0; padding: 24px; }
h1 { font-size: 26px; margin: 0 0 8px; }
p { color: #555; margin: 0 0 28px; }
a.btn { display: block; margin: 12px 0; padding: 16px; border-radius: 12px; background: #1f3f6f; color: #fff; text-decoration: none; font-size: 18px; font-weight: bold; }
a.btn.ios { background: #000; }
small { display: block; margin-top: 32px; color: #888; }
</style>
</head>
<body>
<div class="box">
<h1>App Kimera Eventi</h1>
<p>Prenota il tavolo, ordina e resta aggiornato su eventi e serate.</p>
<a class="btn" href="https://play.google.com/store/apps/details?id=it.kimeraeventi.pienissimo">Scarica per Android</a>
<a class="btn ios" href="https://apps.apple.com/it/app/kimera-eventi/id6793140437">Scarica per iPhone</a>
<small>Kimera – A.S.D. Canottieri Flora, Via Riglio 14, Cremona · 353 4623441</small>
</div>
</body>
</html>
